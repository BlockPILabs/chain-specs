name: 代码格式验证

on:
  push:
  pull_request:

jobs:
  code-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v45
        with:
          files: |
            **/*.json
            **/*.yaml
            **/*.yml

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # ubuntu-latest 已迁移到 Ubuntu 26.04，setup-python 不再提供 3.9 的构建
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyYAML

      - name: Validate JSON and YAML files
        run: |
          if [ "${{ steps.changed-files.outputs.any_changed }}" = "true" ]; then
            echo "Changed files: ${{ steps.changed-files.outputs.all_changed_files }}"
            python .github/scripts/validate_files.py --changed-files ${{ steps.changed-files.outputs.all_changed_files }} --check-json --check-yaml
          else
            echo "No JSON or YAML files changed"
          fi