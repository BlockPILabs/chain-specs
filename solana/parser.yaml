## https://app.notion.com/p/blockpi/solana-RPC-40d6874f685e80ef823ddd12c763fa17
#
# archiveBilling:
#   slot   - archive (2 RU) when target slot < firstAvailable + 5000, otherwise full (1 RU)
#   always - always archive (2 RU)
#   never  - always full (1 RU)

# Archive billing methods (image scope)

# "getTransaction":
#   fromBlock: "earliest"
#   toBlock: "earliest"
#   archiveBilling: "slot"

"getBlock":
  fromBlock: ".body.params.[0]|tostring"
  toBlock: ".body.params.[0]|tostring"
  archiveBilling: "slot"

"getBlockTime":
  fromBlock: ".body.params.[0]|tostring"
  toBlock: ".body.params.[0]|tostring"
  archiveBilling: "slot"

"getBlocks":
  fromBlock: ".body.params.[0]|tostring"
  toBlock: ".body.params.[1]|tostring"
  archiveBilling: "slot"

"getBlocksWithLimit":
  fromBlock: ".body.params.[0]|tostring"
  toBlock: ".body.params.[0]|tostring"
  archiveBilling: "slot"

"getSignaturesForAddress":
  fromBlock: ".body.params.[1].minContextSlot|tostring"
  toBlock: ".body.params.[1].minContextSlot|tostring"
  archiveBilling: "always"

"getFirstAvailableBlock":
  fromBlock: "earliest"
  toBlock: "earliest"
  archiveBilling: "always"

"getSignatureStatuses":
  fromBlock: "earliest"
  toBlock: "earliest"
  archiveBilling: "slot"

