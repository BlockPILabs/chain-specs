# GW-RL-001/003/004 fixture（2026-11-26）
# 说明：q 必须与 ru 共存才生效，故每条规则都同时给出 q 与 ru；
# 除 GW-RL-004 外，ru 都配成极大值，确保先命中 q。
methods:
  # GW-RL-001 / 002：q 超限文案
  - name: "eth_getLogs"
    q: "60-M"
    ru: "1000000-D"

  # GW-RL-003：周期渲染 2-S / 2-M / 2-H / 2-D
  - name: "eth_blockNumber"
    q: "2-S"
    ru: "1000000-D"
  - name: "eth_gasPrice"
    q: "2-M"
    ru: "1000000-D"
  - name: "eth_mining"
    q: "2-H"
    ru: "1000000-D"
  - name: "eth_hashrate"
    q: "2-D"
    ru: "1000000-D"

  # GW-RL-004：ru 超限报 RU（eth_getBalance 15 RU/次）
  - name: "eth_getBalance"
    q: "1000-M"
    ru: "15-M"
